name: Android emulator smoke evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "worker/runner.py"
      - "worker/tests/**"
      - "smoke-android/**"
      - ".github/workflows/android-emulator-smoke.yml"
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build known-good test APK
        working-directory: smoke-android
        run: gradle --no-daemon assembleDebug
      - name: Add Android build-tools to PATH
        shell: bash
        run: |
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          command -v adb
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Boot disposable Android emulator and execute runner
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            export ANDROID_SERIAL=emulator-5554
            export BHARATSIM_ENABLE_LOCAL_APK_EXECUTION=true
            mkdir -p artifacts
            python worker/runner.py smoke-android/app/build/outputs/apk/debug/app-debug.apk --duration 5 --out artifacts
            python - <<'PY'
            import json
            from pathlib import Path
            reports = list(Path("artifacts").glob("*.report.json"))
            assert len(reports) == 1, f"expected one runner report, got {len(reports)}"
            report = json.loads(reports[0].read_text())
            assert report["status"] == "completed", report
            assert report["package_name"] == "org.bharatsim.smokeapp", report.get("package_name")
            assert any(s["name"] == "install_apk" and s["return_code"] == 0 for s in report["steps"]), report["steps"]
            assert any(s["name"] == "launch_app" and s["return_code"] == 0 for s in report["steps"]), report["steps"]
            assert any(s["name"] == "collect_logcat" and s["return_code"] == 0 for s in report["steps"]), report["steps"]
            print(json.dumps({"status": report["status"], "apk_sha256": report["apk_sha256"], "package_name": report["package_name"], "steps": [s["name"] for s in report["steps"]], "fatal_exception_marker": report["fatal_exception_marker"]}, indent=2))
            PY
      - name: Preserve emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bharatsim-android-emulator-smoke
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
