services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bharatsim
      POSTGRES_USER: service_role
      POSTGRES_PASSWORD: ${BHARATSIM_LOCAL_POSTGRES_PASSWORD:?Set BHARATSIM_LOCAL_POSTGRES_PASSWORD to a unique local-only secret}
    volumes:
      - bharatsim-postgres:/var/lib/postgresql/data
      - ./dev-postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_role -d bharatsim"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [bharatsim]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BHARATSIM_ENV: ${BHARATSIM_ENV:-development}
      BHARATSIM_DATABASE_URL: ${BHARATSIM_DATABASE_URL:-postgresql://service_role:${BHARATSIM_LOCAL_POSTGRES_PASSWORD:?Set BHARATSIM_LOCAL_POSTGRES_PASSWORD to a unique local-only secret}@postgres:5432/bharatsim?sslmode=disable}
      BHARATSIM_DATA_DIR: /app/backend/data
      BHARATSIM_MAX_UPLOAD_MB: ${BHARATSIM_MAX_UPLOAD_MB:-150}
      BHARATSIM_REQUIRE_API_KEY: ${BHARATSIM_REQUIRE_API_KEY:-false}
      BHARATSIM_API_KEY: ${BHARATSIM_API_KEY:-}
      BHARATSIM_WORKER_TOKEN: ${BHARATSIM_WORKER_TOKEN:-}
      BHARATSIM_CORS_ORIGINS: ${BHARATSIM_CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - bharatsim-data:/app/backend/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [bharatsim]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BHARATSIM_API_KEY: ${BHARATSIM_API_KEY:-}
      NGINX_ENVSUBST_FILTER: ^BHARATSIM_API_KEY$
    ports:
      - "127.0.0.1:${BHARATSIM_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [bharatsim]

volumes:
  bharatsim-data:
  bharatsim-postgres:

networks:
  bharatsim:
    driver: bridge
