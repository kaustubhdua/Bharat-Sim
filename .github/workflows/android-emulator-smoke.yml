name: Android emulator smoke evidence
# Keep the live Android network data-plane experiment attached to the current probe contract.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/runner.py"
      - "worker/agent.py"
      - "worker/tests/**"
      - "backend/**"
      - "smoke-android/**"
      - "scripts/ci/**"
      - ".github/workflows/android-emulator-smoke.yml"
  pull_request:
    paths:
      - "worker/runner.py"
      - "worker/agent.py"
      - "worker/tests/**"
      - "backend/**"
      - "smoke-android/**"
      - "scripts/ci/**"
      - ".github/workflows/android-emulator-smoke.yml"
permissions:
  contents: read
concurrency:
  group: android-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_API_LEVEL: "35"
      ANDROID_SYSTEM_IMAGE_TARGET: google_apis
      ANDROID_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify real traffic through isolated Linux netem interface
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping
          sudo bash scripts/ci/network-shaper-e2e.sh
      - name: Install Appium and Android UIAutomator2 driver
        run: |
          npm install --global appium@3
          appium driver install uiautomator2
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Preinstall emulator image with transient-download retries
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          installed=false
          for attempt in 1 2 3 4 5; do
            echo "Installing emulator and API 35 Google APIs image (attempt $attempt/5)"
            if "$SDKMANAGER" --install "emulator" "system-images;android-35;google_apis;x86_64"; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          if [ "$installed" != true ]; then
            echo "Android emulator image installation failed after five attempts" >&2
            exit 1
          fi
          "$SDKMANAGER" --list_installed | grep -F "system-images;android-35;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Resolve public HTTPS probe address on CI host
        id: probe-address
        shell: bash
        run: |
          ip="$(python - <<'PY'
          import socket
          import subprocess
          import sys

          result = subprocess.run(
              ["timeout", "10s", "getent", "ahostsv4", "raw.githubusercontent.com"],
              check=True, capture_output=True, text=True,
          )
          candidates = list(dict.fromkeys(
              line.split()[0] for line in result.stdout.splitlines() if line.split()
          ))
          for candidate in candidates:
              try:
                  with socket.create_connection((candidate, 443), timeout=5):
                      print(candidate)
                      break
              except OSError as exc:
                  print(f"Skipping unreachable raw.githubusercontent.com IPv4 {candidate}: {exc}", file=sys.stderr)
          else:
              raise SystemExit("No raw.githubusercontent.com IPv4 address accepts direct TCP/443 from this runner")
          PY
          )"
          if [[ ! "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Could not select a reachable raw.githubusercontent.com IPv4 address" >&2
            exit 1
          fi
          echo "Selected reachable raw.githubusercontent.com IPv4 $ip"
          mkdir -p artifacts
          printf '%s\n' "$ip" > artifacts/probe-ip.txt
          # Verify the exact pinned address used by the CONNECT proxy, not a second DNS choice.
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 --resolve "raw.githubusercontent.com:443:$ip" --range 0-0 --output /dev/null https://raw.githubusercontent.com/kaustubhdua/Bharat-Sim/${{ github.event.pull_request.head.sha || github.sha }}/smoke-android/probe-256k.bin
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
      - name: Start allowlisted HTTPS shaping proxy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP"
          python3 scripts/ci/https_shaping_proxy.py \
            --proxy-host 0.0.0.0 --proxy-port 8888 \
            --control-host 127.0.0.1 --control-port 8889 \
            --target-ip raw.githubusercontent.com=${{ steps.probe-address.outputs.ip }} \
            > "$RUNNER_TEMP/bharatsim-https-proxy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bharatsim-https-proxy.pid"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8889/health >/dev/null; then
              echo "Allowlisted HTTPS shaping proxy is ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/bharatsim-https-proxy.log"
          exit 1
      - name: Build known-good test APK
        working-directory: smoke-android
        env:
          BHARATSIM_PROBE_URL: https://raw.githubusercontent.com/kaustubhdua/Bharat-Sim/${{ github.event.pull_request.head.sha || github.sha }}/smoke-android/probe-256k.bin
          BHARATSIM_PROBE_IP: ${{ steps.probe-address.outputs.ip }}
          BHARATSIM_PROXY_HOST: 10.0.2.2
          BHARATSIM_PROXY_PORT: "8888"
        run: gradle --no-daemon assembleDebug
      - name: Add Android build-tools to PATH
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          command -v adb
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot disposable Android emulator and execute runner
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BHARATSIM_PROBE_URL: https://raw.githubusercontent.com/kaustubhdua/Bharat-Sim/${{ github.event.pull_request.head.sha || github.sha }}/smoke-android/probe-256k.bin
          BHARATSIM_PROBE_IP: ${{ steps.probe-address.outputs.ip }}
          BHARATSIM_PROXY_HOST: 10.0.2.2
          BHARATSIM_PROXY_PORT: "8888"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # The fixture binds to the active Android Network and uses an allowlisted host CONNECT proxy for measurable delay/rate shaping.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -netdelay none -netspeed full
          script: bash scripts/ci/android-emulator-e2e.sh
      - name: Preserve host proxy logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f "$RUNNER_TEMP/bharatsim-https-proxy.log" ]; then
            cp "$RUNNER_TEMP/bharatsim-https-proxy.log" artifacts/https-shaping-proxy.log
          fi
      - name: Generate evidence artifact manifest
        if: always()
        env:
          EVIDENCE_COMMIT: ${{ github.sha }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("artifacts")
          root.mkdir(parents=True, exist_ok=True)
          records = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "evidence-manifest.json":
                  continue
              if path.suffix.lower() in {".jks", ".keystore", ".p12", ".pfx"}:
                  raise SystemExit(
                      f"Refusing to publish signing-key material in CI evidence: {path.relative_to(root)}"
                  )
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              records.append({
                  "path": str(path.relative_to(root)),
                  "size_bytes": path.stat().st_size,
                  "sha256": digest.hexdigest(),
              })
          metadata_path = root / "run-metadata.json"
          run_metadata = json.loads(metadata_path.read_text()) if metadata_path.is_file() else None
          manifest = {
              "schema_version": "1.1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "github_run_id": os.environ["EVIDENCE_RUN_ID"],
              "commit_sha": os.environ["EVIDENCE_COMMIT"],
              "worker_revision": os.environ["EVIDENCE_COMMIT"],
              "run_metadata": run_metadata,
              "artifact_count": len(records),
              "artifacts": records,
          }
          (root / "evidence-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps({"artifact_count": len(records), "manifest": str(root / "evidence-manifest.json")}, indent=2))
          PY
      - name: Preserve emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bharatsim-android-emulator-smoke
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
