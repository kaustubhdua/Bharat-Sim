plugins { id "com.android.application" }
def probeUrl = System.getenv("BHARATSIM_PROBE_URL") ?: "https://raw.githubusercontent.com/kaustubhdua/Bharat-Sim/main/smoke-android/probe-256k.bin"
def probeIp = System.getenv("BHARATSIM_PROBE_IP") ?: "0.0.0.0"
def probeProxyHost = System.getenv("BHARATSIM_PROXY_HOST") ?: "10.0.2.2"
def probeProxyPort = System.getenv("BHARATSIM_PROXY_PORT") ?: "8888"
if (!(probeIp ==~ /^[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}$/)) throw new GradleException("BHARATSIM_PROBE_IP must be an IPv4 address")
if (!(probeProxyPort ==~ /^[0-9]{1,5}$/) || probeProxyPort.toInteger() < 1 || probeProxyPort.toInteger() > 65535) throw new GradleException("BHARATSIM_PROXY_PORT must be a valid TCP port")
android {
    buildFeatures { buildConfig true }
    namespace "org.bharatsim.smokeapp"
    compileSdk 35
    defaultConfig {
        applicationId "org.bharatsim.smokeapp"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "PROBE_URL", "\"${probeUrl}\""
        buildConfigField "String", "PROBE_IP", "\"${probeIp}\""
        buildConfigField "String", "PROBE_PROXY_HOST", "\"${probeProxyHost}\""
        buildConfigField "int", "PROBE_PROXY_PORT", probeProxyPort
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
