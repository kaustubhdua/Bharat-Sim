name: Android emulator smoke evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/runner.py"
      - "worker/agent.py"
      - "worker/tests/**"
      - "backend/**"
      - "smoke-android/**"
      - "scripts/ci/**"
      - ".github/workflows/android-emulator-smoke.yml"
  pull_request:
    paths:
      - "worker/runner.py"
      - "worker/tests/**"
      - "smoke-android/**"
      - "scripts/ci/**"
      - ".github/workflows/android-emulator-smoke.yml"
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify real traffic through isolated Linux netem interface
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping
          sudo bash scripts/ci/network-shaper-e2e.sh
      - name: Install Appium and Android UIAutomator2 driver
        run: |
          npm install --global appium@3
          appium driver install uiautomator2
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build known-good test APK
        working-directory: smoke-android
        run: gradle --no-daemon assembleDebug
      - name: Add Android build-tools to PATH
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          command -v adb
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot disposable Android emulator and execute runner
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/ci/android-emulator-e2e.sh
      - name: Preserve emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bharatsim-android-emulator-smoke
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
