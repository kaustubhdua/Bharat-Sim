plugins { id "com.android.application" }
def probeUrl = System.getenv("BHARATSIM_PROBE_URL") ?: "https://speed.cloudflare.com/__down?bytes=500000"
def probeIp = System.getenv("BHARATSIM_PROBE_IP") ?: "0.0.0.0"
if (!(probeIp ==~ /^[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}$/)) throw new GradleException("BHARATSIM_PROBE_IP must be an IPv4 address")
android {
    buildFeatures { buildConfig true }
    namespace "org.bharatsim.smokeapp"
    compileSdk 35
    defaultConfig {
        applicationId "org.bharatsim.smokeapp"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "PROBE_URL", "\"${probeUrl}\""
        buildConfigField "String", "PROBE_IP", "\"${probeIp}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
