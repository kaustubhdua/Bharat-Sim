plugins { id "com.android.application" }
def probeUrl = System.getenv("BHARATSIM_PROBE_URL") ?: "https://speed.cloudflare.com/__down?bytes=2000000"
android {
    buildFeatures { buildConfig true }
    namespace "org.bharatsim.smokeapp"
    compileSdk 35
    defaultConfig {
        applicationId "org.bharatsim.smokeapp"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "PROBE_URL", "\"${probeUrl}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
