plugins { id "com.android.application" }

def probeIp = project.findProperty("probeIp")?.toString()
if (!probeIp || !(probeIp ==~ /(?:\d{1,3}\.){3}\d{1,3}/)) {
    throw new GradleException("Pass -PprobeIp=<resolved IPv4 address> for the DNS-independent network probe")
}
android {
    buildFeatures { buildConfig true }
    namespace "org.bharatsim.smokeapp"
    compileSdk 35
    defaultConfig {
        applicationId "org.bharatsim.smokeapp"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "PROBE_IP", "\"${probeIp}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
