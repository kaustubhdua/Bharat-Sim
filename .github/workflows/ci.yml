name: CI
# Planner request/response changes are covered by the backend and frontend contract suites.
on:
  push:
    branches: [main, "draft/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: pytest -q
        working-directory: backend
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare minimal Supabase-compatible auth roles for local Postgres
        run: |
          psql "$BHARATSIM_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          SQL
        env:
          PGPASSWORD: postgres
          BHARATSIM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      - name: Apply isolated BharatSim migrations from a clean database
        run: |
          psql "$BHARATSIM_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261027054905_bharatsim_core.sql \
            -f supabase/migrations/20261027061609_bharatsim_fk_indexes.sql \
            -f supabase/migrations/20261101042942_bharatsim_signed_upload_sizes.sql
        env:
          PGPASSWORD: postgres
          BHARATSIM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      - name: Verify API persistence across real PostgreSQL-backed API restarts
        run: pytest -q tests/test_restart_persistence.py tests/test_postgres_quotas.py tests/test_postgres_signed_uploads.py
        working-directory: backend
        env:
          PGPASSWORD: postgres
          BHARATSIM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
        working-directory: frontend
      - name: Test dashboard against real API
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"

  worker-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest worker.tests.test_network_shaper worker.tests.test_runner worker.tests.test_agent worker.tests.test_appium_smoke_journey worker.tests.test_https_shaping_proxy worker.tests.test_android_connect_source
      - run: python -m py_compile worker/agent.py worker/runner.py worker/network_shaper.py worker/tests/appium_smoke_journey.py worker/tests/test_appium_smoke_journey.py scripts/ci/https_shaping_proxy.py worker/tests/test_android_connect_source.py scripts/firecracker_host_preflight.py
      - name: Test read-only Firecracker host preflight
        run: python -m unittest discover -s backend/tests -p test_firecracker_host_preflight.py

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API container
        run: docker build -f backend/Dockerfile -t bharatsim-api:ci .
      - name: Build frontend container
        run: docker build -f frontend/Dockerfile -t bharatsim-web:ci .
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Smoke-test hardened Compose stack
        run: |
          set -euo pipefail
          trap 'docker compose down -v' EXIT
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/api/v1/capabilities | python -c 'import json,sys; data=json.load(sys.stdin); assert isinstance(data, dict)'
          docker compose ps

          # Verify the optional single-tenant key is injected by nginx server-side,
          # accepted by the API, and absent from the static frontend bundle.
          export BHARATSIM_API_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export BHARATSIM_REQUIRE_API_KEY=true
          docker compose down -v
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/api/v1/personas | python -c 'import json,sys; assert len(json.load(sys.stdin)["items"]) >= 4'
          docker compose exec -T api python -c 'import os,urllib.error,urllib.request; base="http://127.0.0.1:8000/api/v1/personas"; req=urllib.request.Request(base); exec("try:\n urllib.request.urlopen(req,timeout=3)\n raise SystemExit(1)\nexcept urllib.error.HTTPError as e:\n assert e.code == 401"); req=urllib.request.Request(base,headers={"X-BharatSim-API-Key":os.environ["BHARATSIM_API_KEY"]}); assert urllib.request.urlopen(req,timeout=3).status == 200'
          if docker compose exec -T web sh -c "grep -R -F '$BHARATSIM_API_KEY' /usr/share/nginx/html"; then
            echo "API key leaked into the static frontend bundle" >&2
            exit 1
          fi
          docker compose ps
